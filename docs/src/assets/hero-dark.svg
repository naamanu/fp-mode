<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0.2" />
    </linearGradient>
  </defs>

  <!-- Background glow -->
  <ellipse cx="240" cy="140" rx="200" ry="120" fill="url(#grad2)" />

  <!-- Lambda symbol -->
  <text x="240" y="165" text-anchor="middle" font-family="serif" font-size="140" font-weight="bold" fill="url(#grad1)">&#955;</text>

  <!-- Terminal bracket decorations -->
  <text x="80" y="170" text-anchor="middle" font-family="monospace" font-size="60" fill="#71717a" opacity="0.5">{</text>
  <text x="400" y="170" text-anchor="middle" font-family="monospace" font-size="60" fill="#71717a" opacity="0.5">}</text>

  <!-- Floating code symbols -->
  <text x="130" y="80" font-family="monospace" font-size="18" fill="#a855f7" opacity="0.6">::</text>
  <text x="340" y="75" font-family="monospace" font-size="18" fill="#ec4899" opacity="0.6">-&gt;</text>
  <text x="110" y="230" font-family="monospace" font-size="18" fill="#ec4899" opacity="0.6">|&gt;</text>
  <text x="360" y="235" font-family="monospace" font-size="18" fill="#a855f7" opacity="0.6">let</text>
  <text x="170" y="55" font-family="monospace" font-size="14" fill="#71717a" opacity="0.4">fun</text>
  <text x="300" y="250" font-family="monospace" font-size="14" fill="#71717a" opacity="0.4">match</text>

  <!-- Accent dots -->
  <circle cx="95" cy="110" r="3" fill="#a855f7" opacity="0.4" />
  <circle cx="385" cy="105" r="3" fill="#ec4899" opacity="0.4" />
  <circle cx="155" cy="250" r="2" fill="#a855f7" opacity="0.3" />
  <circle cx="330" cy="55" r="2" fill="#ec4899" opacity="0.3" />
</svg>
